name: Windows release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Wails and NSIS
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
          choco install nsis -y --no-progress
          echo 'C:\Program Files (x86)\NSIS' >> "$GITHUB_PATH"
      - name: Build Windows app, CLI, and relay
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          LD="-s -w -X github.com/opensave/opensave/internal/version.Version=$V -X github.com/opensave/opensave/internal/version.BuildTime=$(date +%s)"
          (cd cmd/opensave-app && OPENSAVE_VERSION="$V" wails build -nsis -ldflags "$LD")
          go build -ldflags="$LD" -o dist/opensave-cli.exe ./cmd/opensave-cli
          go build -ldflags="$LD" -o dist/opensave-relay.exe ./cmd/opensave-relay
          installer=(cmd/opensave-app/build/bin/*installer*.exe)
          test -f "${installer[0]}"
          mv "${installer[0]}" cmd/opensave-app/build/bin/OpenSave.Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            cmd/opensave-app/build/bin/*.exe
            dist/*.exe
  release:
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: windows
      - name: Prepare Windows assets
        run: |
          find windows -type f -name '*.exe' -exec mv -t windows {} +
          sha256sum windows/*.exe > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          name: OpenSave ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            windows/*.exe
            SHA256SUMS
